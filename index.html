<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>AR GPS - Laboratorio de Redes</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #interface {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            pointer-events: none;
        }

        #startButton {
            pointer-events: auto;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #2196f3;
            color: white;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 8px;
        }

        #gpsInfo {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 8px;
            font-size: 14px;
        }

        #legend {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            padding: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }

    </style>

</head>

<body>

    <canvas id="canvas"></canvas>

    <div id="interface">

        <button id="startButton">
            INICIAR AR
        </button>

        <div id="status">
            Presiona INICIAR AR para comenzar.
        </div>

        <div id="gpsInfo">
            Esperando ubicación...
        </div>

    </div>

    <div id="legend">

        Calibración:
        rojo = Norte,
        amarillo = Sur,
        celeste = Oeste,
        verde = Este.

        <br>

        Magenta = "Laboratorio de Redes".

    </div>

    <script type="module" src="/src/main.js"></script>

</body>

</html>
